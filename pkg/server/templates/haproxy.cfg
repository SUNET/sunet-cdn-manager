global
        # https://www.haproxy.com/blog/encoding-haproxy-logs-in-machine-readable-json-or-cbor
        setenv HTTPLOG_JSON "%{+json}o %(client_ip)ci %(client_port)cp %(request_date)tr %(fe_name_transport)ft %(be_name)b %(server_name)s %(time_request)TR %(time_wait)Tw %(time_connect)Tc %(time_response)Tr/%(time_active)Ta %(status_code)ST %(bytes_read)B %(captured_request_cookie)CC %(captured_response_cookie)CS %(termination_state_cookie)tsc %(actconn)ac %(feconn)fc %(beconn)bc %(srv_conn)sc %(retries)rc %(srv_queue)sq %(backend_queue)bq %(captured_request_headers)hr %(captured_response_headers)hs %(http_request){+Q}r"
        log stdout format raw local0 info
        stats socket /haproxy-stats/stats.sock mode 600
        stats timeout 30s

        # Default SSL material locations
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

        # Make sure we do not leave an unbounded number of busy workers when
        # reloading the configuration.
        mworker-max-reloads 10

        # Make sure a process does not not get stuck forever in soft-stop
        # shutdown even if connections are remaining open.
        hard-stop-after 600s

        # Set a static localpeer name so we can sync stick-table contents
        # during reload with ourselves without having to care about the actual
        # hostname of the node we are running on.
        localpeer local_haproxy

peers mypeers
        peer local_haproxy /haproxy-local/local_haproxy_peer

resolvers mydns
        parse-resolv-conf
        accepted_payload_size 8192

defaults
        log     global
        mode    http
        log-format "${HTTPLOG_JSON}"
        timeout connect 5000
        timeout client  50000
        timeout server  50000
        errorfile 400 /usr/local/etc/haproxy/errors/400.http
        errorfile 403 /usr/local/etc/haproxy/errors/403.http
        errorfile 408 /usr/local/etc/haproxy/errors/408.http
        errorfile 500 /usr/local/etc/haproxy/errors/500.http
        errorfile 502 /usr/local/etc/haproxy/errors/502.http
        errorfile 503 /usr/local/etc/haproxy/errors/503.http
        errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Varnish connection
frontend service_frontend
{{- range $index, $addr := .AddressStrings}}
{{- if $.HTTPEnabled}}
        bind {{$addr}}:80
{{- end}}
{{- if $.HTTPSEnabled}}
        bind {{$addr}}:443 ssl crt /certs-private
{{- end}}
{{- end}}
        default_backend varnish_backend

backend varnish_backend
        server varnish /shared/unix-sockets/varnish send-proxy-v2 proxy-v2-options ssl

# Origin servers
{{- range $index, $originGroup := $.OriginGroups}}
{{- if $originGroup.HTTPS }}
frontend {{$originGroup.Name}}_https_frontend
        bind /shared/unix-sockets/haproxy_{{$originGroup.Name}}_https accept-proxy mode 660
        default_backend {{$originGroup.Name}}_https_backend

backend {{$originGroup.Name}}_https_backend
        stick-table type ipv6 size 1m peers mypeers
        stick on src
{{- range $index, $origin := $.Origins}}
{{- if and $origin.TLS (eq $origin.OriginGroupID $originGroup.ID)}}
        {{- if $origin.VerifyTLS}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none ssl ca-file /etc/ssl/certs/ca-certificates.crt alpn http/1.1 sni req.hdr(host)
        {{- else}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none ssl verify none alpn http/1.1 sni req.hdr(host)
        {{- end }}
{{- end}}
{{- end}}
{{- end}}
{{- if $originGroup.HTTP }}
frontend {{$originGroup.Name}}_http_frontend
        bind /shared/unix-sockets/haproxy_{{$originGroup.Name}}_http accept-proxy mode 660
        default_backend {{$originGroup.Name}}_http_backend

backend {{$originGroup.Name}}_http_backend
        stick-table type ipv6 size 1m peers mypeers
        stick on src
{{- range $index, $origin := $.Origins}}
{{- if and (not $origin.TLS) (eq $origin.OriginGroupID $originGroup.ID)}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none
{{- end}}
{{- end}}
{{- end}}
{{- end}}
