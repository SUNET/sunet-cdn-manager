global
        setenv CDN_ORG_ID '{{.OrgID}}'
        setenv CDN_SERVICE_ID '{{.ServiceID}}'
        setenv CDN_SERVICE_VERSION '{{.ServiceVersion}}'
        # https://www.haproxy.com/blog/encoding-haproxy-logs-in-machine-readable-json-or-cbor
        setenv HTTPLOG_JSON "%{+json}o %(client_ip)ci %(client_port)cp %(request_date)tr %(fe_name_transport)ft %(be_name)b %(server_name)s %(time_request)TR %(time_wait)Tw %(time_connect)Tc %(time_response)Tr/%(time_active)Ta %(status_code)ST %(bytes_read)B %(captured_request_cookie)CC %(captured_response_cookie)CS %(termination_state_cookie)tsc %(actconn)ac %(feconn)fc %(beconn)bc %(srv_conn)sc %(retries)rc %(srv_queue)sq %(backend_queue)bq %(captured_request_headers)hr %(captured_response_headers)hs %(request_id)ID %(bc_reused)[bc_reused] %(http_request){+Q}r"
        log 127.0.0.1:5140 len 16384 format rfc5424 local0 info
        # Use hostname field to carry tenant IDs and service version number.
        # While haproxy itself allows a longer log-tag it maps to either syslog
        # RFC 3164 TAG (max 32 characters) or syslog RFC 5424 APP-NAME (48 characters).
        # Neither is long enough to hold two UUID strings. These fields are
        # guaranteed to be present for all syslog messages, even the ones that do not
        # relate to traffic.
        log-send-hostname "${CDN_ORG_ID}_${CDN_SERVICE_ID}_${CDN_SERVICE_VERSION}"
        stats socket /haproxy-stats/stats.sock mode 600
        stats timeout 30s

        # Default SSL material locations
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private

        # generated 2026-10-06, TLSRef Guideline v6.0, HAProxy 3.4, OpenSSL 4.0.0, intermediate config, gitrev=2a5e549
        # https://configurator.tlsref.org/#server=haproxy&version=3.4&config=intermediate&openssl=4.0.0&guideline=6.0
        # intermediate configuration
        ssl-default-bind-curves X25519MLKEM768:X25519:prime256v1:secp384r1
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.2 no-tls-tickets

        ssl-default-server-curves X25519MLKEM768:X25519:prime256v1:secp384r1
        ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
        ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets

        # Make sure we do not leave an unbounded number of busy workers when
        # reloading the configuration.
        mworker-max-reloads 10

        # Make sure a process does not not get stuck forever in soft-stop
        # shutdown even if connections are remaining open.
        hard-stop-after 600s

        # Set a static localpeer name so we can sync stick-table contents
        # during reload with ourselves without having to care about the actual
        # hostname of the node we are running on.
        localpeer local_haproxy

        # Limit number of threads per tenant, also limits number of opened UDP
        # sockets for syslog sending
        nbthread 16

        # Set a known maxconn so we can leave room below for backend connections
        maxconn 250000

peers mypeers
        peer local_haproxy /haproxy-local/local_haproxy_peer

resolvers mydns
        nameserver dns1 127.53.53.53:53
        accepted_payload_size 8192

defaults
        log-format "${HTTPLOG_JSON}"
        log     global
        mode    http
        timeout connect 5s
        timeout client  50s
        timeout server  50s
        timeout http-request 10s
        errorfile 400 /usr/local/etc/haproxy/errors/400.http
        errorfile 403 /usr/local/etc/haproxy/errors/403.http
        errorfile 408 /usr/local/etc/haproxy/errors/408.http
        errorfile 500 /usr/local/etc/haproxy/errors/500.http
        errorfile 502 /usr/local/etc/haproxy/errors/502.http
        errorfile 503 /usr/local/etc/haproxy/errors/503.http
        errorfile 504 /usr/local/etc/haproxy/errors/504.http

frontend prometheus_frontend
{{- range $index, $addr := .AddressStrings}}
        bind {{$addr}}:9090
{{- end}}
        mode http
        http-request use-service prometheus-exporter

frontend service_frontend
        # Leave room under global maxconn for the origin-side frontends (vinyl
        # fetches) and the prometheus frontend
        maxconn 240000
        timeout http-keep-alive 10s
        acl allowed_host req.hdr(host),host_only -f /service-versions/active/haproxy/allowed-hosts.lst
        http-request deny deny_status 421 if !allowed_host
{{- range $index, $addr := .AddressStrings}}
{{- if $.HTTPEnabled}}
        bind {{$addr}}:80
{{- end}}
{{- if $.HTTPSEnabled}}
        bind {{$addr}}:443 ssl crt-list /service-versions/active/haproxy/certs.lst
{{- end}}
{{- end}}
        # Give every client request an ID and pass it on through vinyl to the
        # origin-side frontends below, so their log lines (which have no
        # client port since the switch away from vinyl .proxy_header) can be
        # joined with the log line from this frontend. set-header replaces
        # any value supplied by the client.
        unique-id-format %[uuid()]
        http-request set-header SUNET-CDN-Request-ID %[unique-id]
        default_backend vinyl_backend

backend vinyl_backend
        # Longer than vinyl first_byte_timeout and between_bytes_timeout (60s by default)
        timeout server 90s
        server vinyl /shared/unix-sockets/vinyl send-proxy-v2 proxy-v2-options ssl

# Origin servers
{{- range $index, $originGroup := $.OriginGroups}}
{{- if $originGroup.HTTPS }}
frontend {{$originGroup.Name}}_https_frontend
        # Longer than vinyl backend_idle_timeout (60s by default) so we never
        # close a connection vinyl is about to reuse.
        timeout http-keep-alive 75s
        bind /shared/unix-sockets/haproxy_{{$originGroup.Name}}_https mode 660
        # Vinyl appends client.ip (from the PROXY header sent to it by
        # service_frontend) as the last X-Forwarded-For element. Use it as
        # the source address for "stick on src" and %ci in logs. Only
        # tenant VCL can change this value, not external clients.
        http-request set-src req.hdr_ip(x-forwarded-for,-1)
        # Reuse the request ID set by service_frontend for log correlation.
        # Remove the del-header line to also pass the ID on to origins.
        http-request set-var(txn.request_id) req.hdr(sunet-cdn-request-id)
        unique-id-format %[var(txn.request_id)]
        http-request del-header sunet-cdn-request-id
        default_backend {{$originGroup.Name}}_https_backend

backend {{$originGroup.Name}}_https_backend
        http-reuse safe
        # Retry if the connection failed (request never sent) or the origin
        # closed the connection without answering...
        retry-on conn-failure empty-response
        # ...but once sent, only retry safe methods (METH_GET covers GET and
        # HEAD), since other methods may already have changed state on the
        # origin. If a request with another method fails on a reused
        # connection, haproxy closes the vinyl connection without a response
        # and in this case the vcl_backend_fetch macro stops vinyl from
        # retrying it.
        http-request disable-l7-retry unless METH_GET || METH_OPTIONS
        # One retry covers the common case of an idle pooled connection that
        # the origin closed just as it was reused, and is redispatched to
        # another server if there is one. If it also fails, haproxy answers
        # vinyl with an error response (not a silent close), so vinyl does
        # not add a retry of its own. More retries would mostly add load to
        # an origin that is already failing.
        retries 1
        option redispatch
        stick-table type ipv6 size 1m expire 30m peers mypeers
        stick on src
{{- range $index, $origin := $.Origins}}
{{- if and $origin.TLS (eq $origin.OriginGroupID $originGroup.ID)}}
        {{- if $origin.VerifyTLS}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none ssl ca-file /etc/ssl/certs/ca-certificates.crt alpn http/1.1
        {{- else}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none ssl verify none alpn http/1.1
        {{- end }}
{{- end}}
{{- end}}
{{- end}}
{{- if $originGroup.HTTP }}
frontend {{$originGroup.Name}}_http_frontend
        # See {{$originGroup.Name}}_https_frontend for comments.
        timeout http-keep-alive 75s
        bind /shared/unix-sockets/haproxy_{{$originGroup.Name}}_http mode 660
        http-request set-src req.hdr_ip(x-forwarded-for,-1)
        http-request set-var(txn.request_id) req.hdr(sunet-cdn-request-id)
        unique-id-format %[var(txn.request_id)]
        http-request del-header sunet-cdn-request-id
        default_backend {{$originGroup.Name}}_http_backend

backend {{$originGroup.Name}}_http_backend
        # See {{$originGroup.Name}}_https_backend for comments.
        http-reuse safe
        retry-on conn-failure empty-response
        http-request disable-l7-retry unless METH_GET || METH_OPTIONS
        retries 1
        option redispatch
        stick-table type ipv6 size 1m expire 30m peers mypeers
        stick on src
{{- range $index, $origin := $.Origins}}
{{- if and (not $origin.TLS) (eq $origin.OriginGroupID $originGroup.ID)}}
        server s{{$index}} {{$origin.Host}}:{{$origin.Port}} resolvers mydns init-addr last,libc,none
{{- end}}
{{- end}}
{{- end}}
{{- end}}
